[project]
name = "hnsw-audit-vector-benchmark"
version = "0.1.0"
description = "Unfindable-vector (orphan) audit for Dgraph vector indexes vs hnswlib"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydgraph>=23.0.0",
    "numpy>=1.24.0",
    "h5py>=3.9.0",
    "hnswlib>=0.8.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["*.py", "*.md"]
