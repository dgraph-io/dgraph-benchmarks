# Cluster for the bulk-load benchmark. run.sh drives the phases:
#   1. zero            (up first)
#   2. bulk            (one-shot: dgraph bulk -> the `bulkout` volume, then exits)
#   3. alpha           (serves the bulk output p-directory from `bulkout`)
# Set DGRAPH_VERSION=local to test a locally built dgraph/dgraph:local image.

services:
  zero:
    image: ${DGRAPH_IMAGE:-dgraph/dgraph}:${DGRAPH_VERSION:-local}
    hostname: zero
    command: dgraph zero --my=zero:5080 --replicas 1
    ports:
      - "5080:5080"
      - "6080:6080"
    networks:
      - dgraph

  # One-shot bulk loader. SCHEMA_FILE selects the index config for this run
  # (schema-hnsw.txt or schema-partitioned.txt, generated by datasets.py).
  bulk:
    image: ${DGRAPH_IMAGE:-dgraph/dgraph}:${DGRAPH_VERSION:-local}
    depends_on:
      - zero
    # --out points at a subdir of the volume, not the mount point itself:
    # --replace_out rm -rf's its --out dir, and unlinking a mount point fails
    # with "device or resource busy".
    command: >
      dgraph bulk
      -f /work/data.rdf.gz
      -s /work/${SCHEMA_FILE:-schema-hnsw.txt}
      --zero zero:5080
      --map_shards 1 --reduce_shards 1
      -j ${BULK_THREADS:-8}
      --out /data/out --replace_out
    volumes:
      - ./work:/work:ro
      - bulkout:/data
    networks:
      - dgraph

  alpha:
    image: ${DGRAPH_IMAGE:-dgraph/dgraph}:${DGRAPH_VERSION:-local}
    hostname: alpha
    depends_on:
      - zero
    command: >
      dgraph alpha --my=alpha:7080 --zero=zero:5080
      -p /data/out/0/p -w /data/out/0/w
      --security "whitelist=0.0.0.0/0;"
    ports:
      - "8080:8080"
      - "9080:9080"
    volumes:
      - bulkout:/data
    networks:
      - dgraph

networks:
  dgraph:
    driver: bridge

volumes:
  bulkout:
